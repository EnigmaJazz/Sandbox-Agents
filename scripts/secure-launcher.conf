# Shared launcher configuration for scripts/start-secure-opencode and
# scripts/start-openchamber. Sourced by both; edit here, not in the scripts.
#
# Paths are the DISCOVERED host paths (docs/discovery-report.md §2). The
# control directory is created by start-secure-opencode before nono starts,
# because nono expands profile grants at launch time.
#
# NOT INSTALLED at Gate 1 — this file is only read by the launchers.

# Dedicated control directory for the secured OpenCode process (spec §15).
# NEVER start secure OpenCode from a real project directory.
CONTROL_DIR="$HOME/.local/share/opencode-sandbox-control"

# Discovered binaries.
NONO_BIN="/home/linuxbrew/.linuxbrew/bin/nono"
OPENCODE_BIN="$HOME/.opencode/bin/opencode"
OPENCHAMBER_BIN="$HOME/.bun/bin/openchamber"

# Secured server endpoint (spec §23).
OPENCODE_HOSTNAME="127.0.0.1"
OPENCODE_PORT="4096"

# nono profile name as installed by scripts/install-user-files (Gate 2+).
NONO_PROFILE="opencode-secure"

# Broker socket (must match broker/src/config.ts).
BROKER_SOCKET="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/opencode-sandbox-broker.sock"

# Project roots that must NEVER be the CWD of secure OpenCode (spec §15).
# These are placeholders — extend at Gate 2 review with the real allowlist
# from broker/src/config.ts (DEFAULT_PROJECTS).
PROJECT_ROOTS=(
  # "/home/james/example"
)

# Approved external read roots (S6) — mirrors broker config; keep in sync.
APPROVED_READ_ROOTS=(
  # "/home/james/reference"
)
