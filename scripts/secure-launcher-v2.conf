# Launcher configuration for the parallel OpenCode V2 stack (docs/upgrades/opencode-v2.md, workstream V6).
# Sourced by scripts/start-secure-opencode-v2, scripts/install-user-files-v2 and scripts/rollback-v2. It builds on
# secure-launcher.conf (project roots, control directory, nono binary) and overrides nothing V1 uses: V2 has its own
# binary, XDG roots, port, nono profile and password file. V1 and V2 must never share a config root, because V2
# would load the plugins in V1's plugins/ directory.
#
# NOT INSTALLED - delivery is manual (S17).
_V2_CONF_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
# secure-launcher.conf assigns NONO_BIN unconditionally, so keep an override made by the caller (tests only).
_V2_NONO_OVERRIDE="${NONO_BIN:-}"
# shellcheck source=scripts/secure-launcher.conf
source "$_V2_CONF_DIR/secure-launcher.conf"

# Everything V2 owns lives under one root: XDG config/data/state/cache, the pinned CLI install and the password.
V2_ROOT="$HOME/.local/share/opencode-v2"
V2_XDG_CONFIG_HOME="$V2_ROOT/config"
V2_XDG_DATA_HOME="$V2_ROOT/data"
V2_XDG_STATE_HOME="$V2_ROOT/state"
V2_XDG_CACHE_HOME="$V2_ROOT/cache"

# Pinned CLI installed into its own prefix (npm @opencode/cli; its binaries are `opencode` and `opencode2`).
# Overridable for tests only; the launcher refuses anything inside the V1 install.
V2_BIN="${OPENCODE_V2_BIN:-$V2_ROOT/prefix/node_modules/.bin/opencode2}"

# V2 serve takes its password from OPENCODE_SERVER_PASSWORD. It is read from this file (mode 0600), exported only to
# the server process and never printed or put on a command line.
V2_PASSWORD_FILE="$V2_ROOT/server-password"

V2_HOSTNAME="127.0.0.1"
V2_PORT="4097"
V2_NONO_PROFILE="opencode-v2-secure"

# nono is overridable for tests only.
NONO_BIN="${_V2_NONO_OVERRIDE:-$NONO_BIN}"

# What install-user-files-v2 installs and rollback-v2 removes: "<repo path>|<path under the V2 plugins dir>".
# Entries sort in the order V2 runs hooks: the routing guard ("00-") first. The V1 libraries are the host-neutral
# ones the V2 adapters import; the V1 plugin entries, the legacy SDD tools and the V1 fragments are NOT installed.
V2_PLUGINS_DIR="$V2_XDG_CONFIG_HOME/opencode/plugins"
V2_PLUGIN_FILES=(
  "opencode/plugins-v2/00-routing-guard.ts|00-routing-guard.ts"
  "opencode/plugins-v2/reviewer-relay-transport.ts|reviewer-relay-transport.ts"
  "opencode/plugins-v2/sandbox-tools.ts|sandbox-tools.ts"
  "opencode/plugins-v2/lib/guard-core.ts|lib/guard-core.ts"
  "opencode/plugins-v2/lib/relay-v2.ts|lib/relay-v2.ts"
  "opencode/plugins-v2/lib/v2-adapter.ts|lib/v2-adapter.ts"
  "opencode/plugins/lib/apply-preview-guard.ts|lib/apply-preview-guard.ts"
  "opencode/plugins/lib/broker-client.ts|lib/broker-client.ts"
  "opencode/plugins/lib/host-tool-approval.ts|lib/host-tool-approval.ts"
  "opencode/plugins/lib/reviewer-relay-core.ts|lib/reviewer-relay-core.ts"
  "opencode/plugins/lib/sandbox-edit-core.ts|lib/sandbox-edit-core.ts"
  "opencode/plugins/lib/session-agent-binding.ts|lib/session-agent-binding.ts"
  "opencode/plugins/lib/tool-runtime.ts|lib/tool-runtime.ts"
  "opencode/plugins/lib/tool-specs-host-ops.ts|lib/tool-specs-host-ops.ts"
  "opencode/plugins/lib/tool-specs-host-register.ts|lib/tool-specs-host-register.ts"
  "opencode/plugins/lib/tool-specs-host-result.ts|lib/tool-specs-host-result.ts"
  "opencode/plugins/lib/tool-specs-review-capture.ts|lib/tool-specs-review-capture.ts"
  "opencode/plugins/lib/tool-specs-review-read.ts|lib/tool-specs-review-read.ts"
  "opencode/plugins/lib/tool-specs-sandbox.ts|lib/tool-specs-sandbox.ts"
)
# Staged for MANUAL merge into the V2 opencode.json; never merged by a script.
V2_FRAGMENT_DIR="$V2_ROOT/fragments"
V2_FRAGMENT_FILES=(
  "opencode/plugins-v2/config-fragments/sandbox-permissions.jsonc"
  "opencode/plugins-v2/config-fragments/role-agents.jsonc"
  "opencode/plugins-v2/config-fragments/reviewer-relay-agents.jsonc"
)
V2_NONO_PROFILE_SRC="nono/profile/opencode-v2-secure.json"
V2_NONO_PROFILE_DEST="$HOME/.config/nono/profiles/opencode-v2-secure.json"
